pipeline_name: professor_research_pipeline
version: "2.0"

stable_path_contract:
  step01:
    input:
      seed_url_or_query: "ProfessorName + SeedPaperTitle or SeedPaperUrl"
    output:
      abstracts_jsonl: "01_data_collection/step_results/<prefix>_abstracts.jsonl"
      abstracts_md: "01_data_collection/step_results/<prefix>_abstracts.md"
      lab_info_json: "01_data_collection/step_results/<prefix>_lab_info.json"
    required_fields:
      - pmid
      - title
      - abstract
      - pub_date
      - doi
      - authors

  step02:
    input:
      step01_abstracts_jsonl: "01_data_collection/step_results/<prefix>_abstracts.jsonl"
    output:
      expanded_papers_jsonl: "02_paper_list_extend/step_results/<prefix>_expanded_papers.jsonl"
    required_fields:
      - paper_id
      - source
      - source_id
      - title
      - abstract
      - pub_date
      - doi
      - authors
      - url

  step03:
    input:
      expanded_papers_jsonl: "02_paper_list_extend/step_results/<prefix>_expanded_papers.jsonl"
      step01_lab_info_json: "01_data_collection/step_results/<prefix>_lab_info.json"
    output:
      disambiguated_papers_jsonl: "03_author_disambiguation/step_results/<prefix>_step03_disambiguated_papers.jsonl"
    required_fields:
      - paper_id
      - identity_score
      - identity_decision

  step04:
    input:
      disambiguated_papers_jsonl: "03_author_disambiguation/step_results/<prefix>_step03_disambiguated_papers.jsonl"
    output:
      keyword_entity_jsonl: "04_keyword_entity/step_results/<prefix>_step04_keyword_entity.jsonl"
    required_fields:
      - paper_id
      - keywords
      - quality_score

  step05:
    input:
      keyword_entity_jsonl: "04_keyword_entity/step_results/<prefix>_step04_keyword_entity.jsonl"
    output:
      paper_domains_jsonl: "05_domain_analysis/step_results/<prefix>_step05_paper_domains.jsonl"
      domains_json: "05_domain_analysis/step_results/<prefix>_step05_domains.json"
      wordcloud_terms_json: "05_domain_analysis/step_results/<prefix>_step05_wordcloud_terms.json"
      wordcloud_png: "05_domain_analysis/step_results/<prefix>_step05_wordcloud.png"
    required_fields:
      - paper_id
      - primary_tag_name
      - tag_items

  step06:
    input:
      paper_domains_jsonl: "05_domain_analysis/step_results/<prefix>_step05_paper_domains.jsonl"
    output:
      project_timeline_json: "06_temporal_analysis/step_results/<prefix>_step06_project_timeline.json"
      effort_allocation_json: "06_temporal_analysis/step_results/<prefix>_step06_effort_allocation.json"
      trend_report_md: "06_temporal_analysis/step_results/<prefix>_step06_trend_report.md"
    required_fields:
      - timeline

  step07:
    input:
      paper_domains_jsonl: "05_domain_analysis/step_results/<prefix>_step05_paper_domains.jsonl"
      timeline_json: "06_temporal_analysis/step_results/<prefix>_step06_project_timeline.json"
    output:
      duckdb_path: "07_visualization/step_results/pipeline.duckdb"
      source_sites_json: "07_visualization/step_results/<prefix>_source_sites.json"
    required_fields:
      - professor

  step08:
    input:
      step02_expanded_papers_jsonl: "02_paper_list_extend/step_results/<prefix>_expanded_papers.jsonl"
      step03_disambiguated_jsonl: "03_author_disambiguation/step_results/<prefix>_step03_disambiguated_papers.jsonl"
      step04_keyword_entity_jsonl: "04_keyword_entity/step_results/<prefix>_step04_keyword_entity.jsonl"
      step05_paper_domains_jsonl: "05_domain_analysis/step_results/<prefix>_step05_paper_domains.jsonl"
      step05_domains_json: "05_domain_analysis/step_results/<prefix>_step05_domains.json"
      step05_wordcloud_terms_json: "05_domain_analysis/step_results/<prefix>_step05_wordcloud_terms.json"
      step06_timeline_json: "06_temporal_analysis/step_results/<prefix>_step06_project_timeline.json"
      step06_allocation_json: "06_temporal_analysis/step_results/<prefix>_step06_effort_allocation.json"
    output:
      quality_report_json: "08_quality_guard/step_results/<prefix>_step08_quality_report.json"
      quality_report_md: "08_quality_guard/step_results/<prefix>_step08_quality_report.md"
    required_fields:
      - status
      - summary
      - findings
