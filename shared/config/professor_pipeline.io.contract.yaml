pipeline_name: professor_research_pipeline
version: "1.0"

stable_path_contract:
  step01:
    input:
      seed_url_or_query: "ProfessorName + SeedPaperTitle or SeedPaperUrl"
    output:
      abstracts_jsonl: "01_data_collection/step_results/<prefix>_abstracts.jsonl"
      abstracts_md: "01_data_collection/step_results/<prefix>_abstracts.md"
      lab_info_json: "01_data_collection/step_results/<prefix>_lab_info.json"
    required_fields:
      - pmid
      - title
      - abstract
      - pub_date
      - doi
      - authors

  step02:
    input:
      step01_abstracts_jsonl: "01_data_collection/step_results/<prefix>_abstracts.jsonl"
    output:
      expanded_papers_jsonl: "02_paper_list_extend/step_results/<prefix>_expanded_papers.jsonl"
    required_fields:
      - paper_id
      - source
      - source_id
      - title
      - abstract
      - pub_date
      - doi
      - authors
      - url

  step03:
    input:
      expanded_papers_jsonl: "02_paper_list_extend/step_results/<prefix>_expanded_papers.jsonl"
      step01_lab_info_json: "01_data_collection/step_results/<prefix>_lab_info.json"
    output:
      disambiguated_papers_jsonl: "04_author_disambiguation/step_results/<prefix>_disambiguated_papers.jsonl"
    required_fields:
      - paper_id
      - identity_score
      - identity_decision
      - identity_evidence

  step04:
    input:
      disambiguated_papers_jsonl: "04_author_disambiguation/step_results/<prefix>_disambiguated_papers.jsonl"
    output:
      keyword_entity_jsonl: "05_keyword_entity/step_results/<prefix>_keyword_entity.jsonl"
    required_fields:
      - paper_id
      - keywords
      - entities
      - project_candidates

  step05:
    input:
      keyword_entity_jsonl: "05_keyword_entity/step_results/<prefix>_keyword_entity.jsonl"
    output:
      paper_domains_jsonl: "06_domain_clustering/step_results/<prefix>_paper_domains.jsonl"
      domains_json: "06_domain_clustering/step_results/<prefix>_domains.json"
    required_fields:
      - paper_id
      - domain_label
      - domain_confidence

  step06:
    input:
      paper_domains_jsonl: "06_domain_clustering/step_results/<prefix>_paper_domains.jsonl"
    output:
      project_timeline_json: "07_temporal_analysis/step_results/<prefix>_project_timeline.json"
      effort_allocation_json: "07_temporal_analysis/step_results/<prefix>_effort_allocation.json"
      trend_report_md: "07_temporal_analysis/step_results/<prefix>_trend_report.md"
    required_fields:
      - project_or_domain
      - share_current
      - trend_future
      - evidence
