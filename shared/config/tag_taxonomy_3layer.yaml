version: "1.0"

# 三层标签体系：
# - L1：顶层大类（仅供理解与展示总览，不等价于论文细粒度标签）
# - L2：高频标签（面向方向/学科）
# - L3：高频标签（面向技术/主题）
#
# 说明：keywords 用于在 title/abstract/keywords/project_candidates 中做本地规则匹配。

l1_categories:
  - name: "综述/系统分析"
    keywords:
      - review
      - systematic
      - meta-analysis
      - survey
      - literature
      - "综述"
      - "系统"
      - "系统分析"
      - "荟萃"
      - "meta"
      - "数据库综述"
  - name: "方法学/工具开发"
    keywords:
      - database
      - atlas
      - platform
      - pipeline
      - framework
      - tool
      - benchmark
      - dataset
      - model
      - algorithm
      - "数据库"
      - "平台"
      - "框架"
      - "流程"
      - "工具"
      - "方法"
  - name: "机制研究"
    keywords:
      - mechanism
      - pathway
      - regulates
      - suppresses
      - induces
      - molecular
      - omics
      - transcriptomic
      - proteomic
      - "机制"
      - "通路"
      - "组学"
      - "转录组"
      - "蛋白组"

